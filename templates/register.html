<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.1">
    <title>注册</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>

</head>
<body class="register-page">
<div class="abc">
    <div class="container mt-5">
        <h2 class="reg">注册</h2>
         <!-- 显示闪存消息 -->
        {% with messages = get_flashed_messages(with_categories=True) %}
            {% if messages %}
                <div id="flash-message" class="alert alert-{{ messages[0][0] }} alert-dismissible fade show" role="alert">
                    {{ messages[0][1] }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    {% if redirect_to_login %}
                        <div class="mt-3">
                            <a href="{{ url_for('login') }}" class="btn btn-primary">点击这里登录</a>
                        </div>
                    {% endif %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" onsubmit="return validateForm()">
            <div class="mb-3">
                <label for="username" class="form-label">用户名</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">密码</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-semi-transparent">注册</button>
            <a href="{{ url_for('login') }}" class="btn btn-semi-transparent">返回登录</a> <!-- 跳转到登录按钮 -->
        </form>
    </div>
</div>


    <script>
        // 自动关闭闪存消息
        window.onload = function() {
            const flashMessage = document.getElementById('flash-message');
            if (flashMessage) {
                setTimeout(() => {
                    flashMessage.classList.remove('show'); // 移除显示类
                    flashMessage.classList.add('fade');   // 添加渐隐类
                    setTimeout(() => flashMessage.remove(), 150); // 移除 DOM 元素
                }, 5000); // 三秒后开始隐藏
            }
        };

        // 表单验证
        function validateForm() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (username.length < 6) {
                alert('账号长度不能少于6位');
                return false;
            }
            if (password.length < 6) {
                alert('密码长度不能少于6位');
                return false;
            }
            return true;
        }
    </script>
</body>
</html>
