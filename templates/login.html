<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录页面</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background-image: url("../static/snow.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            margin: auto;
            background-color: rgb(255,255,255,0.7%);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            width: 400px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2 class="text-center mb-4">登录</h2>
    <!-- 表单 action 改为 Flask 的 url_for -->
    <form action="{{ url_for('login') }}" method="POST">
        <div class="mb-3">
            <label for="username" class="form-label">用户名</label>
            <!-- 默认值设置为后端传递的 username -->
            <input type="text" class="form-control" id="username" name="username" value="{{ username }}" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">密码</label>
            <!-- 默认值设置为后端传递的 password -->
            <input type="password" class="form-control" id="password" name="password" value="{{ password }}" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">登录</button>
    </form>
    <div class="text-center mt-3">
        <a href="{{ url_for('register') }}">注册</a>
    </div>
</div>

<!-- 获取并显示闪存消息 -->
{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <div class="alert alert-success alert-dismissible fade show position-fixed top-0 start-50 translate-middle-x mt-4" role="alert" style="z-index: 1050; width: 300px;">
            {{ messages[0][1] }}  <!-- 显示提示信息 -->
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% if category == 'success' %}
            <script>
                // 2秒后自动跳转到主页
                setTimeout(function() {
                    window.location.href = "{{ url_for('login') }}";
                    }, 2000);
            </script>
            {% endif %}
        {% endfor %}
    {% endif %}
{% endwith %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
