<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录页面</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background-image: url("../static/snow.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            margin: auto;
            background: rgba(255,255,255,0.92);
            padding: 36px 32px 28px 32px;
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.18);
            width: 400px;
            max-width: 95vw;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: box-shadow 0.3s;
        }
        .login-container:hover {
            box-shadow: 0 12px 40px rgba(0,0,0,0.22);
        }
        .login-container h2 {
            font-weight: 700;
            color: #007bff;
            letter-spacing: 2px;
        }
        .login-container .form-label {
            font-weight: 500;
        }
        .login-container .btn-primary {
            font-weight: 600;
            letter-spacing: 1px;
        }
        .login-container .btn-outline-primary, .login-container .btn-outline-secondary {
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2 class="text-center mb-4">登录</h2>
    <form action="{{ url_for('login') }}" method="POST">
        <div class="mb-3">
            <label for="username" class="form-label">用户名</label>
            <input type="text" class="form-control" id="username" name="username" value="{{ username }}" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">密码</label>
            <input type="password" class="form-control" id="password" name="password" value="{{ password }}" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">登录</button>
    </form>
    <div class="text-center mt-3 d-flex flex-column gap-2">
        <a class="btn btn-outline-primary w-100" href="{{ url_for('register') }}">注册</a>
        <a class="btn btn-outline-secondary w-100" href="{{ url_for('home') }}">返回主页</a>
    </div>
</div>

<!-- 获取并显示闪存消息 -->
{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <div class="alert alert-success alert-dismissible fade show position-fixed top-0 start-50 translate-middle-x mt-4" role="alert" style="z-index: 1050; width: 300px;">
            {{ messages[0][1] }}  <!-- 显示提示信息 -->
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% if category == 'success' %}
            <script>
                // 2秒后自动跳转到主页
                setTimeout(function() {
                    window.location.href = "{{ url_for('login') }}";
                    }, 2000);
            </script>
            {% endif %}
        {% endfor %}
    {% endif %}
{% endwith %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
