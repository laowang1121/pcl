<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加文章</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<div class="container mt-5">
    <h2>添加新文章</h2>
    <form method="POST" action="/add_article" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="title" class="form-label">文章标题</label>
            <input type="text" class="form-control" id="title" name="title" required>
        </div>
        <div class="mb-3">
            <label for="summary" class="form-label">文章摘要</label>
            <textarea class="form-control" id="summary" name="summary" rows="3" required></textarea>
        </div>
        <div class="mb-3">
        <label for="cover_image" class="form-label">封面图片</label>
                <input type="file" name="cover_image" id="cover_image" class="form-control">
        </div>
        <div class="mb-3">
            <label for="content" class="form-label">文章内容</label>
            <textarea class="form-control" id="content" name="content" rows="5" required></textarea>
            <div class="mt-2">
                <label for="image" class="form-label">上传图片</label>
                <input type="file" class="form-control" id="image" name="file" accept="image/*">
                <button type="button" class="btn btn-secondary mt-2" onclick="uploadImage()">上传并插入图片</button>
                <div class="mt-3">
            <img id="imagePreview" src="" alt="上传的图片" style="display: none; max-width: 80%; border: 1px solid #ddd; padding: 5px;">
        </div>
            </div>
        </div>
        {{ form.hidden_tag() }}
        <button type="submit" class="btn btn-primary">提交</button>
    </form>
</div>

<script>
    function uploadImage() {
        var formData = new FormData();
        var fileInput = document.getElementById('image');
        if (!fileInput.files.length) {
            alert('请选择文件');
            return;
        }
        formData.append('file', fileInput.files[0]);

        fetch('/upload_image', {
            method: 'POST',
            body: formData
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('网络响应失败');
            }
            return response.json();
        })
        .then(data => {
            if (data.location) {
                const imgTag = `<img src="${data.location}" alt="Uploaded Image" style="max-width: 100%;">`;
                document.getElementById('content').value += imgTag; // 将图片插入到内容区域
                // 更新预览框
                const preview = document.getElementById('imagePreview');
                preview.src = data.location;
                preview.style.display = 'block';
                alert('图片上传成功');
                fileInput.value = ''; // 清空文件输入框
            } else {
                alert('图片上传失败');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('图片上传出现错误');
        });
    }
</script>

<!-- 引入Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
